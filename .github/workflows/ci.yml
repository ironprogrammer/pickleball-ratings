name: CI

on:
  pull_request:
    branches:
      - trunk
  push:
    branches:
      - trunk

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Check out the branch under test
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # Both installs resolve from the committed lockfiles, so the toolchain
      # always matches the branch being tested. Locally, vendor/ and
      # node_modules/ are shared across branches and can silently lint or test
      # against a different version of a dependency than the branch pins.
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install the WordPress test suite
        run: |
          sudo apt-get update
          sudo apt-get install -y subversion
          bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1:3306 latest

      - name: Lint
        run: npm run lint

      - name: Build blocks
        run: npm run build

      - name: Run tests
        run: vendor/bin/phpunit
        env:
          WP_TESTS_DIR: /tmp/wordpress-tests-lib
